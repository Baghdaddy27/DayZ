name: DayZ Weekly Market Reset

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 3:00 UTC (5:00 AM Madrid)
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  upload-market-files:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Upload market files to Zap FTP
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            open -u ${{ secrets.ZAP_FTP_USER }},${{ secrets.ZAP_FTP_PASS }} 147.189.174.4 -p 21;
            cd /g690188/dayz-experimental/config/ExpansionMod/Market;
            mirror -R --reverse ./DayZ/Market_Defaults . --verbose --only-newer;
            quit
          " >> upload.log 2>&1
      
      - name: Show upload log
        if: always()
        run: cat upload.log
      
      - name: Log completion
        run: echo "[$(date)] Upload complete"
